<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Johar Barha Free Satellite & OSM Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #142218;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #map-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #zoom-controls {
      position: fixed;
      right: 14px;
      bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .zoom-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(245, 158, 11, 0.55);
      background: rgba(16, 19, 24, 0.88);
      color: #f8fafc;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
    }
    #attribution {
      position: fixed;
      left: 12px;
      bottom: 10px;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(16, 19, 24, 0.78);
      color: #cbd5e1;
      font-size: 10px;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="map-canvas"></canvas>
  <div id="zoom-controls">
    <button class="zoom-btn" id="btn-zin" aria-label="Zoom In">+</button>
    <button class="zoom-btn" id="btn-zout" aria-label="Zoom Out">−</button>
    <button class="zoom-btn" id="btn-recenter" aria-label="Recenter">◎</button>
  </div>
  <div id="attribution">Esri World Imagery &amp; OpenStreetMap (Free • No API Key)</div>

  <script>
    const CENTER_LAT = 23.0035;
    const CENTER_LNG = 78.2215;

    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');
    const attrEl = document.getElementById('attribution');

    let currentLat = CENTER_LAT;
    let currentLng = CENTER_LNG;
    let currentHeading = 0;
    let viewLat = CENTER_LAT;
    let viewLng = CENTER_LNG;
    let zoom = 16;
    let activeLayer = 'satellite'; // 'satellite' (Esri World Imagery + Labels) | 'osm' (OpenStreetMap)

    const tileCache = new Map();

    // Key Gram Johar Barha landmarks mapped near 23.0035, 78.2215
    const metersPerLat = 111132;
    const metersPerLng = 111320 * Math.cos((CENTER_LAT * Math.PI) / 180);
    const VILLAGE_PINS = [
      { label: 'Panchayat Chowk', lat: CENTER_LAT, lng: CENTER_LNG, color: '#f59e0b' },
      { label: 'Raju Chai Tapri', lat: CENTER_LAT + 28 / metersPerLat, lng: CENTER_LNG + 52 / metersPerLng, color: '#38bdf8' },
      { label: 'Sarpanch Haveli', lat: CENTER_LAT + 165 / metersPerLat, lng: CENTER_LNG + 245 / metersPerLng, color: '#22c55e' },
      { label: 'Chacha Ka Khet', lat: CENTER_LAT + 310 / metersPerLat, lng: CENTER_LNG - 420 / metersPerLng, color: '#84cc16' },
      { label: 'Gaon Nukkad', lat: CENTER_LAT - 195 / metersPerLat, lng: CENTER_LNG + 460 / metersPerLng, color: '#fb923c' },
    ];

    function notifyAndroid(status, detail) {
      try {
        if (window.StreetViewBridge && typeof window.StreetViewBridge.onStatus === 'function') {
          window.StreetViewBridge.onStatus(status, detail);
        }
      } catch (_) {}
    }

    function latLngToTileXY(lat, lng, z) {
      const n = Math.pow(2, z);
      const x = ((lng + 180) / 360) * n;
      const latRad = (lat * Math.PI) / 180;
      const y = ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n;
      return { x, y };
    }

    function tileXYToLatLng(tx, ty, z) {
      const n = Math.pow(2, z);
      const lng = (tx / n) * 360 - 180;
      const latRad = Math.atan(Math.sinh(Math.PI * (1 - (2 * ty) / n)));
      return { lat: (latRad * 180) / Math.PI, lng };
    }

    function getTileImage(url) {
      if (tileCache.has(url)) return tileCache.get(url);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      const entry = { img, loaded: false };
      img.onload = () => {
        entry.loaded = true;
        renderMap();
      };
      img.src = url;
      tileCache.set(url, entry);
      if (tileCache.size > 220) {
        tileCache.delete(tileCache.keys().next().value);
      }
      return entry;
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      renderMap();
    }

    function renderMap() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.fillStyle = activeLayer === 'osm' ? '#e5e7eb' : '#152518';
      ctx.fillRect(0, 0, w, h);

      const tileSize = 256;
      const zInt = Math.max(12, Math.min(18, Math.round(zoom)));
      const centerTile = latLngToTileXY(viewLat, viewLng, zInt);

      const startX = Math.floor(centerTile.x - w / (2 * tileSize) - 1);
      const endX = Math.ceil(centerTile.x + w / (2 * tileSize) + 1);
      const startY = Math.floor(centerTile.y - h / (2 * tileSize) - 1);
      const endY = Math.ceil(centerTile.y + h / (2 * tileSize) + 1);

      const maxIdx = Math.pow(2, zInt);
      for (let tx = startX; tx <= endX; tx++) {
        for (let ty = startY; ty <= endY; ty++) {
          if (tx < 0 || ty < 0 || tx >= maxIdx || ty >= maxIdx) continue;
          const sx = Math.floor(w / 2 + (tx - centerTile.x) * tileSize);
          const sy = Math.floor(h / 2 + (ty - centerTile.y) * tileSize);

          if (activeLayer === 'osm') {
            const osmUrl = `https://tile.openstreetmap.org/${zInt}/${tx}/${ty}.png`;
            const osmTile = getTileImage(osmUrl);
            if (osmTile.loaded) {
              ctx.drawImage(osmTile.img, sx, sy, tileSize, tileSize);
            } else {
              ctx.fillStyle = '#dbe4dc';
              ctx.fillRect(sx, sy, tileSize - 1, tileSize - 1);
            }
          } else {
            const satUrl = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zInt}/${ty}/${tx}`;
            const satTile = getTileImage(satUrl);
            if (satTile.loaded) {
              ctx.drawImage(satTile.img, sx, sy, tileSize, tileSize);
            } else {
              ctx.fillStyle = '#1c3020';
              ctx.fillRect(sx, sy, tileSize - 1, tileSize - 1);
            }

            const roadUrl = `https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/${zInt}/${ty}/${tx}`;
            const roadTile = getTileImage(roadUrl);
            if (roadTile.loaded) {
              ctx.drawImage(roadTile.img, sx, sy, tileSize, tileSize);
            }
          }
        }
      }

      // 1.5 km Red Laser Geofence Ring
      const villageCenter = latLngToTileXY(CENTER_LAT, CENTER_LNG, zInt);
      const vcx = w / 2 + (villageCenter.x - centerTile.x) * tileSize;
      const vcy = h / 2 + (villageCenter.y - centerTile.y) * tileSize;
      const metersPerPixel = (156543.03392 * Math.cos((CENTER_LAT * Math.PI) / 180)) / Math.pow(2, zInt);
      const fenceRadiusPx = 1500 / metersPerPixel;

      ctx.save();
      ctx.beginPath();
      ctx.arc(vcx, vcy, fenceRadiusPx, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.92)';
      ctx.lineWidth = 3.2;
      ctx.setLineDash([10, 6]);
      ctx.stroke();
      ctx.restore();

      // Draw Johar Barha Landmarks
      VILLAGE_PINS.forEach((pin) => {
        const pt = latLngToTileXY(pin.lat, pin.lng, zInt);
        const px = w / 2 + (pt.x - centerTile.x) * tileSize;
        const py = h / 2 + (pt.y - centerTile.y) * tileSize;
        if (px < -60 || px > w + 60 || py < -40 || py > h + 40) return;

        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fillStyle = pin.color;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = 'bold 11px sans-serif';
        const tw = ctx.measureText(pin.label).width;
        ctx.fillStyle = 'rgba(16, 19, 24, 0.82)';
        ctx.fillRect(px - tw / 2 - 5, py - 24, tw + 10, 16);
        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = 'center';
        ctx.fillText(pin.label, px, py - 12);
        ctx.restore();
      });

      // Live Car / Player Chevron
      const pTile = latLngToTileXY(currentLat, currentLng, zInt);
      const px = w / 2 + (pTile.x - centerTile.x) * tileSize;
      const py = h / 2 + (pTile.y - centerTile.y) * tileSize;

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate((currentHeading * Math.PI) / 180);
      ctx.beginPath();
      ctx.arc(0, 0, 15, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(245, 158, 11, 0.36)';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, -11);
      ctx.lineTo(8, 8);
      ctx.lineTo(0, 4);
      ctx.lineTo(-8, 8);
      ctx.closePath();
      ctx.fillStyle = '#f59e0b';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    // Smooth touch drag-pan
    let dragActive = false;
    let lastX = 0;
    let lastY = 0;
    canvas.addEventListener('pointerdown', (e) => {
      dragActive = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!dragActive) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      const zInt = Math.max(12, Math.min(18, Math.round(zoom)));
      const c = latLngToTileXY(viewLat, viewLng, zInt);
      const next = tileXYToLatLng(c.x - dx / 256, c.y - dy / 256, zInt);
      viewLat = next.lat;
      viewLng = next.lng;
      renderMap();
    });
    window.addEventListener('pointerup', () => { dragActive = false; });

    document.getElementById('btn-zin').onclick = () => {
      zoom = Math.min(18, zoom + 1);
      renderMap();
    };
    document.getElementById('btn-zout').onclick = () => {
      zoom = Math.max(12, zoom - 1);
      renderMap();
    };
    document.getElementById('btn-recenter').onclick = () => {
      viewLat = currentLat;
      viewLng = currentLng;
      zoom = 16;
      renderMap();
    };

    window.initFreeMap = function (lat, lng, heading, layer) {
      currentLat = Number(lat) || CENTER_LAT;
      currentLng = Number(lng) || CENTER_LNG;
      currentHeading = Number(heading) || 0;
      viewLat = currentLat;
      viewLng = currentLng;
      activeLayer = layer === 'osm' ? 'osm' : 'satellite';
      attrEl.textContent = activeLayer === 'osm'
        ? '© OpenStreetMap Contributors (100% Free • No API Key)'
        : 'Esri World Imagery + Roads (100% Free • No API Key)';
      renderMap();
      notifyAndroid(
        'READY',
        activeLayer === 'osm'
          ? 'OpenStreetMap Live • Gram Johar Barha (Zero API Key)'
          : 'Esri World Imagery Satellite Live • Gram Johar Barha (Zero API Key)',
      );
    };

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
