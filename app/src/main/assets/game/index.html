<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Johar Barha 3D: Desi Swag & Luxury Drive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #121417;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #boot-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #2a1d0d 0%, #121417 75%);
      color: #f8fafc;
      z-index: 20;
      transition: opacity 0.45s ease;
    }
    #boot-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .boot-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #f59e0b;
      margin-bottom: 8px;
    }
    .boot-sub {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 18px;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(245, 158, 11, 0.25);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-banner {
      display: none;
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fecaca;
      font-size: 13px;
      max-width: 80vw;
      text-align: center;
    }
    #retry-btn {
      display: none;
      margin-top: 12px;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: #f59e0b;
      color: #1a1200;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="boot-overlay">
    <div class="boot-title">JOHAR BARHA 3D</div>
    <div class="boot-sub">Loading Gram Johar Barha, Bareli, Raisen (MP)...</div>
    <div class="spinner" id="boot-spinner"></div>
    <div id="error-banner"></div>
    <button id="retry-btn" onclick="location.reload()">Retry Loading 3D Engine</button>
  </div>

  <script type="module">
    const errEl = document.getElementById('error-banner');
    const retryBtn = document.getElementById('retry-btn');
    const spinner = document.getElementById('boot-spinner');

    window.addEventListener('error', (e) => {
      if (e.message && e.message.includes('three')) {
        spinner.style.display = 'none';
        errEl.style.display = 'block';
        errEl.textContent = '3D engine requires internet once to load Three.js. Check connection and tap Retry.';
        retryBtn.style.display = 'inline-block';
      }
    });

    try {
      const mod = await import('./main.js');
      await mod.bootJoharBarha3D();
    } catch (err) {
      console.error('Boot failed:', err);
      spinner.style.display = 'none';
      errEl.style.display = 'block';
      errEl.textContent = 'Unable to start 3D engine: ' + (err?.message || 'Check internet connection for Three.js CDN.');
      retryBtn.style.display = 'inline-block';
    }
  </script>
</body>
</html>
