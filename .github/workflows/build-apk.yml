name: Build Project-apnogav APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repository Checkout karein
        uses: actions/checkout@v4

      - name: 2. Java (JDK 17) Setup karein
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle Setup karein
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Android APK Build karein
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: 5. APK File Upload karein
        uses: actions/upload-artifact@v4
        with:
          name: Project-apnogav-APK
          path: app/build/outputs/apk/debug/app-debug.apk
