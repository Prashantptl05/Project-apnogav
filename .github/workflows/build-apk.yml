name: Build Project-apnogav APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repository Checkout karein
        uses: actions/checkout@v4

      - name: 2. Three.js ko Offline Local Bundle karein (Black Screen Fix)
        run: |
          curl -L "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" -o app/src/main/assets/game/three.module.js
          sed -i 's|https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js|./three.module.js|g' app/src/main/assets/game/index.html

      - name: 3. Java (JDK 21) Setup karein
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Gradle 9.3.1 Setup karein
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 5. Debug Keystore Generate karein
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 6. Android APK Build karein
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: 7. APK File Upload karein
        uses: actions/upload-artifact@v4
        with:
          name: Project-apnogav-APK
          path: app/build/outputs/apk/debug/app-debug.apk
